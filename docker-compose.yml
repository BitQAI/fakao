version: '3.8'

services:
  backend:
    image: fakaobitqaicom-backend:latest
    container_name: fakao-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
    environment:
      - FAKAO_DATA_DIR=/app/data

  frontend:
    image: fakaobitqaicom-frontend:latest
    container_name: fakao-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000