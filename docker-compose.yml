services:
  backend:
    image: fakaobitqaicom-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fakao-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:rw
      # 覆盖 tts.py 使其优先复用已转码的 .mp3（无需重建镜像）
      - ./backend/app/tts.py:/app/app/tts.py:ro
      - ./backend/app/tts_audit.py:/app/app/tts_audit.py:ro
    environment:
      - FAKAO_DATA_DIR=/app/data

  frontend:
    image: fakaobitqaicom-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fakao-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000